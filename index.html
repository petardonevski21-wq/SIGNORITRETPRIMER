<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signori - Hero Section</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./sliki/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-section">
        
        <!-- HEADER -->
        <header class="header">
            <div class="header-inner">
                <a href="#" class="logo">SIGNORI</a>
                
                <nav class="nav-links">
                    <a href="#">Home</a>
                    <a href="#">Bespoke</a>
                    <a href="#">Ready to Wear</a>
                    <a href="#">Wedding</a>
                    <a href="#">Journal</a>
                    <a href="#">About</a>
                    <a href="#">Contact</a>
                </nav>
                
                <div class="nav-icons">
                    <!-- Search Icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6"></circle><path d="M21 21l-4.3-4.3"></path></svg>
                    <!-- Account / Profile Icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </div>

        <!-- TEXT CONTENT -->
        <div class="hero-content">
            <h1>SUMMER COLLECTION</h1>
            <a href="#" class="shop-btn">SHOP NOW</a>
        </div>
        
    </section>

</html>
